name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: home-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Tests, dbt and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: home_lab_ci
      POSTGRES_USER: home_lab_ci
      POSTGRES_PASSWORD: home_lab_ci_password
      DATABASE_URL: postgresql+psycopg://home_lab_ci:home_lab_ci_password@localhost:5432/home_lab_ci
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "5432"
      HOME_LAB_IMAGE: home-lab:ci
      HOME_LAB_PROD_DATA_DIR: /tmp/home-lab-ci/data
      HOME_LAB_PROD_SECRETS_DIR: /tmp/home-lab-ci/secrets
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: home_lab_ci
          POSTGRES_USER: home_lab_ci
          POSTGRES_PASSWORD: home_lab_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U home_lab_ci -d home_lab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install '.[dev]'

      - name: Validate Python and dependencies
        run: |
          python -m compileall -q src tests
          python -m pip check

      - name: Initialize and validate analytics schemas
        run: |
          home-lab init-db
          home-lab transform

      - name: Run tests
        run: pytest -q

      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet

      - name: Build production image
        run: docker build --file Dockerfile.dashboard --tag home-lab:ci .

  publish:
    name: Publish immutable image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy notebook production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, linux, x64, home-lab-prod]
    timeout-minutes: 15
    environment: production
    concurrency:
      group: home-lab-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy by immutable digest
        run: ./scripts/deploy-production.sh '${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}'
