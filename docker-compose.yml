name: home-lab-dev

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DBT_POSTGRES_HOST: postgres
  DBT_POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  DOCUMENT_STORE_PATH: /data/bronze/gmail
  FINANCIAL_STATEMENT_STORE_PATH: /data/bronze/financial-statements
  HOME_LAB_DBT_PROJECT_DIR: /workspace/dbt
  PYTHONPATH: /workspace/src

x-app-volumes: &app-volumes
  - ./src:/workspace/src:ro
  - ./dbt:/workspace/dbt:rw
  - ./data:/data:rw
  - ${HOME}/.local/share/home-lab/production/bronze/gmail:/data/bronze/gmail:ro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${HOME_LAB_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: ${HOME_LAB_DEV_IMAGE:-home-lab:dev}
    environment:
      <<: *app-environment
    command:
      - streamlit
      - run
      - /workspace/src/home_lab/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.runOnSave=true
    ports:
      - "127.0.0.1:${HOME_LAB_DEV_DASHBOARD_PORT:-8502}:8501"
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true

  migrate:
    image: ${HOME_LAB_DEV_IMAGE:-home-lab:dev}
    profiles: ["ops"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      <<: *app-environment
    command: ["sh", "-ec", "home-lab init-db && home-lab transform"]
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  tools:
    image: ${HOME_LAB_DEV_IMAGE:-home-lab:dev}
    profiles: ["ops"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      <<: *app-environment
      GMAIL_CLIENT_SECRET_PATH: /secrets/gmail_client_secret.json
      GMAIL_TOKEN_PATH: /secrets/gmail_token.json
      GMAIL_QUERY: ${GMAIL_QUERY:-}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-20971520}
      SIAT_TGI_ACCOUNT: ${SIAT_TGI_ACCOUNT:-}
      SIAT_TGI_MANAGEMENT_CODE: ${SIAT_TGI_MANAGEMENT_CODE:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
    entrypoint: ["home-lab"]
    volumes:
      - ./src:/workspace/src:ro
      - ./dbt:/workspace/dbt:rw
      - ./data:/data:rw
      - ./secrets:/secrets:rw
    depends_on:
      postgres:
        condition: service_healthy
    init: true

volumes:
  dev_postgres_data:
    name: ${HOME_LAB_DEV_POSTGRES_VOLUME:-home-lab-dev-postgres-data}
