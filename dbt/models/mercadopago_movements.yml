version: 2

models:
  - name: mercadopago_movements
    description: Movimientos de Mercado Pago enriquecidos con categorías de gastos.
    columns:
      - name: id
        data_tests:
          - not_null
          - unique
      - name: category
        data_tests:
          - not_null:
              config:
                where: "transaction_net_amount < 0"
          - accepted_values:
              arguments:
                values:
                  - Alquiler
                  - Sin categorizar
              config:
                where: "transaction_net_amount < 0"
