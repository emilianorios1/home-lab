version: 2

models:
  - name: gold_movements
    columns:
      - name: source_movement_id
        data_tests: [not_null, unique]
  - name: gold_documents
    columns:
      - name: document_id
        data_tests: [not_null, unique]
  - name: gold_bills
    columns:
      - name: bill_id
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, overdue]
