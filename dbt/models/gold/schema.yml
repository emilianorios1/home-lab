version: 2

models:
  - name: gold_movements
    columns:
      - name: source_movement_id
        data_tests: [not_null, unique]
  - name: gold_documents
    columns:
      - name: document_id
        data_tests: [not_null, unique]
  - name: gold_bills
    columns:
      - name: bill_id
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, overdue]
  - name: gold_bill_payments
    columns:
      - name: source_movement_id
        data_tests: [not_null, unique]
      - name: invoice_id
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_invoices')
                field: invoice_id
  - name: gold_shared_expense_items
    columns:
      - name: summary_month
        data_tests: [not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Expensas, Luz, Agua, Gas, TGI]
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, paid]
