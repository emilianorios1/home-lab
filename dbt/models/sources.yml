version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: import_batches
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
      - name: mercadopago_account_statements
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: batch_id
            data_tests:
              - not_null
      - name: gmail_messages
        columns:
          - name: message_id
            data_tests:
              - not_null
              - unique
      - name: gmail_attachments
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: message_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'gmail_messages')
                    field: message_id
      - name: document_parse_results
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
