version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: import_batches
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
      - name: mercadopago_account_statements
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: batch_id
            data_tests:
              - not_null
      - name: financial_statements
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: source_sha256
            data_tests: [not_null]
      - name: mercadopago_statement_movements
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: statement_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'financial_statements')
                    field: id
      - name: mercadopago_api_movements
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: batch_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'import_batches')
                    field: id
      - name: gmail_messages
        columns:
          - name: message_id
            data_tests:
              - not_null
              - unique
      - name: gmail_attachments
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: message_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'gmail_messages')
                    field: message_id
      - name: document_parse_results
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
      - name: manual_shared_expenses
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
